<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AppLord</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=VT323&display=swap">
<style>
html{color-scheme:dark}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one amber-phosphor CRT monitor — status strip, waterfall pipeline, terminal log, trading floor, command bar. Single deliberate dark look. */
:root{
  --bg:#0c0804;          /* room behind the monitor */
  --screen:#150e06;      /* phosphor glass */
  --amber:#ffb22e;       /* lit phosphor */
  --dim:#a5731f;         /* half-lit */
  --faint:#3b2a12;       /* rules, empty bars */
  --alert:#ff6a3d;       /* audit red-orange */
  --ink:#140c04;         /* text on lit amber */
  --display:'VT323','Courier New',monospace;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--amber)}
body{font-family:var(--mono);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.glow{text-shadow:0 0 6px rgba(255,178,46,.35)}
.masthead{display:flex;flex-direction:column;gap:2px}
.corp{font-size:11px;letter-spacing:.08em;color:var(--dim);text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:clamp(56px,14vw,96px);line-height:.85;margin:6px 0 0;letter-spacing:.04em;text-shadow:0 0 10px rgba(255,178,46,.55),0 0 2px var(--amber)}
h1 small{font-size:.3em;color:var(--dim);letter-spacing:.1em;vertical-align:top;margin-left:.4em}
.sub{color:var(--dim);font-size:13px;max-width:60ch}

.crt{position:relative;background:var(--screen);border:1px solid var(--faint);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:16px;box-shadow:inset 0 0 60px rgba(0,0,0,.6),0 0 0 6px #1d140a,0 0 0 7px var(--faint);overflow:hidden}
.crt::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px);mix-blend-mode:multiply;animation:flick 6s infinite steps(1)}
@keyframes flick{0%,100%{opacity:1}47%{opacity:.85}48%{opacity:1}}
@media (prefers-reduced-motion:reduce){.crt::after{animation:none}.cursor{animation:none!important}.line.new{animation:none!important}}

h2{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;margin:0;letter-spacing:.06em;color:var(--amber)}
.label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}

/* Status strip */
.status{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px;border-bottom:1px dashed var(--faint);padding-bottom:14px}
.stat{display:flex;flex-direction:column;min-width:0}
.stat .v{font-family:var(--display);font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.bad{color:var(--alert)}
.stat.wide{grid-column:span 2}
.bar{font-family:var(--display);font-size:20px;letter-spacing:-1px;color:var(--amber)}
.bar .off{color:var(--faint)}
@media (max-width:520px){.status{grid-template-columns:repeat(2,minmax(0,1fr))}.stat .v{font-size:23px}}

/* Pipeline */
.pipe{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pipe .cell{font-family:var(--display);font-size:20px;padding:2px 8px;border:1px solid var(--faint);color:var(--dim);line-height:1.1}
.pipe .cell.done{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.pipe .cell.now{border-color:var(--amber);color:var(--amber)}
.pipe .arrow{color:var(--faint);font-family:var(--display);font-size:20px}
.cursor{display:inline-block;width:.55em;height:.9em;background:var(--amber);vertical-align:-1px;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.gate{border:1px solid var(--faint);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.gate .title{font-weight:600}
.needs{display:flex;flex-wrap:wrap;gap:6px 14px;font-variant-numeric:tabular-nums}
.need.ok{color:var(--amber)}
.need.short{color:var(--dim)}
.need.ok::before{content:"[x] "}
.need.short::before{content:"[ ] "}
.gate .note{color:var(--dim);font-size:12.5px}

/* Terminal log */
.log{height:13.5em;overflow-y:auto;border-top:1px dashed var(--faint);border-bottom:1px dashed var(--faint);padding:10px 2px;font-size:13.5px;display:flex;flex-direction:column;gap:4px;scrollbar-color:var(--faint) transparent}
.line{max-width:70ch}
.line::before{content:"> ";color:var(--dim)}
.line.hdr{font-family:var(--display);font-size:19px;letter-spacing:.06em;margin-top:6px}
.line.hdr::before{content:""}
.line.dim{color:var(--dim)}
.line.alert{color:var(--alert)}
.line.win{background:var(--amber);color:var(--ink);padding:2px 6px}
.line.win::before{color:var(--ink)}
.line.new{animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(3px)}to{opacity:1}}

/* Market */
.market{display:flex;flex-direction:column;gap:8px}
.mhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(0,1fr) 84px 42px auto;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--faint);font-variant-numeric:tabular-nums}
.row.hdrrow{border-bottom:1px solid var(--dim);padding-top:0}
.row .name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .name .tag{color:var(--alert);font-size:11px;margin-left:4px}
.row .price{text-align:right;font-family:var(--display);font-size:21px}
.row .own{text-align:right;color:var(--dim)}
.row .own.has{color:var(--amber)}
.row .btns{display:flex;gap:6px}
.row.na .name,.row.na .price{color:var(--faint)}
.row.hot .price{color:var(--alert)}

button{font-family:var(--mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;background:transparent;color:var(--amber);border:1px solid var(--dim);padding:0 10px;min-height:38px;cursor:pointer;border-radius:0}
button:hover:not(:disabled){background:var(--amber);color:var(--ink);border-color:var(--amber)}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{color:var(--faint);border-color:var(--faint);cursor:not-allowed}
button.primary{border-color:var(--amber);font-weight:600}
button.mini{min-height:34px;padding:0 9px;font-size:12px}
button kbd{font-family:inherit;color:var(--dim);margin-right:4px}
button:hover:not(:disabled) kbd{color:var(--ink)}

.actions{display:flex;flex-wrap:wrap;gap:8px}
footer{color:var(--dim);font-size:11.5px;text-align:center}

/* Modal */
.modal-back{position:fixed;inset:0;background:rgba(8,5,2,.78);display:flex;align-items:center;justify-content:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--screen);border:1px solid var(--amber);box-shadow:0 0 30px rgba(255,178,46,.15);width:100%;max-width:520px;max-height:100%;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0;line-height:1;letter-spacing:.05em;text-wrap:balance}
.modal h3.alert{color:var(--alert);text-shadow:0 0 8px rgba(255,106,61,.4)}
.modal p{margin:0;max-width:62ch}
.modal .dim{color:var(--dim)}
.modal .alert{color:var(--alert)}
.modal .btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.modal input{font-family:var(--display);font-size:28px;background:var(--bg);color:var(--amber);border:1px solid var(--dim);padding:4px 10px;width:9ch;border-radius:0}
.modal input:focus{outline:2px solid var(--amber);outline-offset:1px}
.qtyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.travel{display:flex;flex-direction:column;gap:6px}
.travel button{text-align:left;text-transform:none;letter-spacing:0;display:flex;flex-direction:column;align-items:flex-start;padding:8px 12px;gap:2px;font-size:14px}
.travel button .w{font-size:11.5px;color:var(--dim)}
.travel button:hover:not(:disabled) .w{color:var(--ink)}
.help table{border-collapse:collapse;width:100%;font-size:12.5px}
.help td,.help th{border-bottom:1px solid var(--faint);padding:5px 6px 5px 0;text-align:left;vertical-align:top}
.help th{color:var(--dim);font-weight:400;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.tablewrap{overflow-x:auto}
.scores{display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums;font-size:12.5px}
.scores div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--faint)}
.big{font-family:var(--display);font-size:40px;line-height:1}
.mg{display:block;width:100%;height:270px;max-width:100%;border:1px solid var(--faint);background:var(--bg);touch-action:none}
.mgctl{display:flex;gap:8px}
.mgctl .steer{flex:1;min-height:58px;font-size:15px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.mgctl .steer.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.mgctl #mg-plus{min-width:72px;font-family:var(--display);font-size:24px}
.mgctl #mg-plus:not(:disabled){border-color:var(--alert);color:var(--alert);animation:blink .5s steps(1) infinite}
@media (prefers-reduced-motion:reduce){.mgctl #mg-plus:not(:disabled){animation:none}}
.bhud{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bhud #b-time{font-family:var(--display);font-size:22px;color:var(--amber);letter-spacing:0}
.transcript{height:8em;overflow-y:auto;border:1px solid var(--faint);background:var(--bg);padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.transcript .sp{color:var(--dim);margin-right:6px}
.transcript div.new{animation:in .35s ease-out}
.bcard{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bcard button{min-height:60px;padding:6px;text-transform:none;letter-spacing:0;font-size:13.5px;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.bcard button.on{background:var(--amber);color:var(--ink);border-color:var(--amber)}
.bcard button.miss{border-color:var(--alert);color:var(--alert)}
.bcard button.win{outline:2px solid var(--alert);outline-offset:-4px}
.bcard button:disabled.on{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead glow">
    <div class="corp">Consolidated Mutual Trust &amp; Fidelity · 100,412 employees · Est. 1887 · Last modernized 1987</div>
    <h1>APPLORD<small>v1.0</small></h1>
    <div class="sub">One app. Six gates. Thirty days. Get it into production before the regulator gets into you.</div>
  </header>

  <main class="crt glow" id="crt">
    <section class="status" id="status" aria-label="Status"></section>
    <section class="pipe" id="pipe" aria-label="SDLC gates"></section>
    <section class="gate" id="gate" aria-label="Next gate"></section>
    <section class="log" id="log" aria-live="polite" aria-label="Terminal log"></section>
    <section class="market">
      <div class="mhead"><h2 id="mtitle">THE BLACK MARKET</h2><span class="label" id="mwhere"></span></div>
      <div class="rows" id="market"></div>
    </section>
    <nav class="actions" id="actions" aria-label="Commands"></nav>
  </main>

  <footer>A work of fiction. Any resemblance to your employer is your employer's problem.</footer>
</div>

<div class="modal-back" id="modal" hidden><div class="modal glow" role="dialog" aria-modal="true" id="mbox"></div></div>

<script>
(function(){
const MAXDAY=30, INTEREST=0.05, CREDIT=10000, CAP_MAX=250;
const ITEMS=[
  {id:'jira',  name:'Jira Tickets',    lo:8,    hi:45},
  {id:'visio', name:'Visio Diagrams',  lo:40,   hi:180},
  {id:'macro', name:'Excel Macros',    lo:90,   hi:450,   sketchy:1},
  {id:'fw',    name:'FW Exceptions',   lo:250,  hi:1100,  sketchy:1},
  {id:'test',  name:'Test Evidence',   lo:30,   hi:220},
  {id:'exec',  name:'Exec Signatures', lo:900,  hi:3800},
  {id:'prod',  name:'Prod Access',     lo:800,  hi:3500,  sketchy:1},
  {id:'oracle',name:'Oracle Licenses', lo:3000, hi:11000, sketchy:1},
];
const LOCS=[
  {id:'cube',name:'Cubicle Farm',where:'Floor 3, Tower B · home base, PMO, break room',bias:{macro:.6,jira:1.1},
   flavor:["Fluorescent hum. Someone is microwaving fish. Again.","A printer jams in the distance. Nobody moves. Nobody ever moves.","Your desk phone has 14 voicemails. All from 2019. All from Gary."]},
  {id:'ba',name:'Business Analysis Silo',where:'Floor 14 · Requirements Sign-off',bias:{visio:.6,jira:1.4,exec:1.35},
   flavor:["A whiteboard reads AS-IS vs TO-BE vs WHY-EVEN-BE.","The analysts are writing requirements for the requirements template.","Someone is arguing that 'the system shall' and 'the system will' are legally different. They might be right."]},
  {id:'exec',name:'Executive Floor',where:'Floor 40 · Architecture Review Board',bias:{exec:.7,visio:1.5,oracle:1.4},
   flavor:["Thick carpet. Thin patience. A VP is 'leveraging' something.","The coffee here is free and the opinions are expensive.","An SVP asks if your app 'has AI in it'. You say yes. It does not."]},
  {id:'sec',name:'InfoSec Bunker',where:'Sub-basement B2 · Security Review',bias:{fw:.6,macro:1.5,prod:1.5},
   flavor:["No windows. No USB ports. No joy.","A sign reads: ALL REQUESTS DENIED BY DEFAULT. HAVE A NICE DAY.","A security analyst stares at you like you personally clicked the phishing link."]},
  {id:'qa',name:'QA Annex',where:'Building 9, Parsippany NJ · User Acceptance Testing',bias:{test:.5,jira:.6,macro:1.2},
   flavor:["The test environment was last refreshed when flip phones were cool.","Test data includes a customer named 'Test McTestface' with $4 billion in checking.","A tester has been waiting on an environment ticket so long he grew a beard. He's 24."]},
  {id:'cab',name:'Conference Room 7B',where:'Floor 7 · Change Advisory Board (Tuesdays only)',bias:{test:1.4,exec:1.25,prod:1.3},
   flavor:["The projector has been broken since 2014. Fixing it requires a CAB approval.","Twelve chairs, nine people, forty opinions.","A stale bagel sits on the table like a monument to someone's retirement."]},
  {id:'dc',name:'Data Center',where:'Secaucus NJ · Production Deploy',bias:{prod:.6,oracle:.75,fw:1.5},
   flavor:["64°F and 90 decibels. The mainframe is older than your manager and better documented.","A rack labeled DO NOT TOUCH has been running payroll since 1991.","A sysadmin eats a sandwich directly over a server. He's earned it."]},
];
const GATES=[
  {code:'REQ', name:'Requirements Sign-off',   loc:'ba',  need:{jira:25,exec:1}, reward:2000,
   pass:"The BAs sign off on 412 pages of requirements. Nobody will ever read them. Phase 1 funding released: +$2,000."},
  {code:'ARB', name:'Architecture Review Board',loc:'exec',need:{visio:8,exec:1}, reward:3000,
   pass:"The ARB approves your design on the condition you never contact them again. +$3,000."},
  {code:'SEC', name:'Security Review',          loc:'sec', need:{fw:6,test:12},  reward:4000,
   pass:"InfoSec grants a provisional pass, valid until they remember you exist. +$4,000."},
  {code:'UAT', name:'User Acceptance Testing',  loc:'qa',  need:{test:30,macro:4},reward:5000,
   pass:"Three business users clicked around for 20 minutes and said 'looks fine I guess'. UAT passed. +$5,000."},
  {code:'CAB', name:'Change Advisory Board',    loc:'cab', need:{prod:2,exec:2}, reward:6000, cabOnly:1,
   pass:"CAB approves your change for the Saturday 2 a.m. window. Your weekend is cancelled. +$6,000."},
  {code:'PROD',name:'Production Deploy',        loc:'dc',  need:{oracle:2,jira:20},reward:0,
   pass:"You open 20 change tickets in 20 systems, feed the Oracle beast, and push the button. IT'S LIVE."},
];
const SPIKE={
  jira:"Agile transformation announced! Every team needs a backlog by Friday. Jira tickets are going for insane prices!",
  visio:"The CTO read a Gartner report. Everyone suddenly needs 'target-state diagrams'. Visio prices are through the roof!",
  macro:"SOX audit season! Finance will pay anything for macros that make the numbers match.",
  fw:"A pen test found Telnet open on the mainframe. Firewall exceptions are now worth more than your car.",
  test:"A regulator asked for 'evidence of testing'. Screenshots are selling like hotcakes!",
  exec:"Q4 change freeze! Getting an exec to sign anything costs a damn fortune.",
  prod:"After the last outage, prod got locked down. Black-market access tokens are fetching crazy money!",
  oracle:"A license audit letter arrived! Everyone's scrambling for 'compliant' Oracle licenses!"
};
const CRASH={
  jira:"An intern bulk-imported 40,000 tickets from a 2009 spreadsheet. Jira tickets are worthless!",
  visio:"Someone discovered PowerPoint has shapes. Visio diagrams are dirt cheap!",
  macro:"A retiring VBA wizard dumped his whole library on a shared drive. Macros for pennies!",
  fw:"InfoSec's approver is on vacation and his backup approves everything. Firewall exceptions are cheap!",
  test:"The offshore vendor delivered 10,000 screenshots of the login page. Test evidence is cheap!",
  exec:"Exec offsite at a golf resort. After the third mimosa, signatures are basically free.",
  prod:"Someone pasted the prod password into a 4,000-person Teams channel. Prod access is cheap as hell!",
  oracle:"A business unit got sold off. Their Oracle licenses are falling off a truck!"
};

const $=s=>document.querySelector(s);
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const item=id=>ITEMS.find(i=>i.id===id);
const locIdx=id=>LOCS.findIndex(l=>l.id===id);
const used=()=>ITEMS.reduce((s,i)=>s+S.inv[i.id],0);
const isCab=d=>d%5===2;
const isFri=d=>d%5===0;
const nextFri=()=>{for(let d=S.day;d<=MAXDAY;d++) if(isFri(d)) return d; return null;};
const nextCab=()=>{for(let d=S.day;d<=MAXDAY;d++) if(isCab(d)) return d; return null;};
const sketchyUnits=()=>ITEMS.filter(i=>i.sketchy).reduce((s,i)=>s+S.inv[i.id],0);

let S=null, newLines=0, hot={};

function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function fetchStore(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}

function log(t,c){S.log.push({t,c:c||''});if(S.log.length>80)S.log.splice(0,S.log.length-80);newLines++;}

function newGame(){
  S={day:1,loc:0,cash:5000,debt:5000,cioReq:0,sanity:100,cap:100,raci:false,gate:0,
     inv:Object.fromEntries(ITEMS.map(i=>[i.id,0])),prices:{},hotItem:null,log:[],over:false,result:null};
  genPrices();
  log('== DAY 1 · CUBICLE FARM ==','hdr');
  log("Welcome to Consolidated Mutual. Your mission: get one (1) app into production by Day 30, when the regulator's deadline hits.");
  log("Six gates, in order. This is waterfall. There is no other way. There has never been another way.");
  log("You have "+fmt(5000)+" of cost-center budget and owe Brenda from the PMO "+fmt(5000)+" at 5% a day. Brenda remembers everything.");
  log("Buy low, sell high, hoard what each gate needs. Tap ? for the playbook.",'dim');
}

function genPrices(){
  const L=LOCS[S.loc], p={};
  const must=new Set(GATES.filter(g=>g.loc===L.id).flatMap(g=>Object.keys(g.need)));
  const price=it=>Math.max(1,Math.round(rnd(it.lo,it.hi)*(L.bias[it.id]||1)));
  ITEMS.forEach(it=>{p[it.id]=(must.has(it.id)||Math.random()<.78)?price(it):null;});
  let missing=ITEMS.filter(i=>p[i.id]==null);
  while(ITEMS.length-missing.length<5){const it=pick(missing);p[it.id]=price(it);missing=missing.filter(m=>m!==it);}
  S.prices=p; S.hotItem=null;
}

function advanceDay(){
  S.day++;
  if(S.debt>0) S.debt=Math.round(S.debt*(1+INTEREST));
  if(S.day>MAXDAY){S.day=MAXDAY;endGame('time');}
}

function damage(n){S.sanity=Math.max(0,S.sanity-n);if(S.sanity<=0)endGame('burnout');}

/* ---------- events ---------- */
function marketEvent(next){
  const avail=ITEMS.filter(i=>S.prices[i.id]!=null);
  const it=pick(avail);
  if(Math.random()<.5){S.prices[it.id]=Math.round(S.prices[it.id]*rnd(3,5));log(SPIKE[it.id],'alert');}
  else{S.prices[it.id]=Math.max(1,Math.round(S.prices[it.id]*rnd(.18,.35)));log(CRASH[it.id],'alert');}
  S.hotItem=it.id; next();
}
const MISC=[
  {w:6,fn(next){const amt=Math.round(S.cash*rnd(.1,.25));if(amt<50)return next();S.cash-=amt;
    log(`A Big-4 consultant corners you at the elevator and bills you ${fmt(amt)} for a 'synergy discovery workshop'. You didn't even get the slides.`,'alert');next();}},
  {w:6,fn(next){const it=pick(ITEMS.filter(i=>i.lo<500));const room=S.cap-used();const q=Math.min(room,ri(3,10));
    if(q<=0)return next();S.inv[it.id]+=q;log(`You find ${q} ${it.name} in a decommissioned SharePoint site. Finders keepers.`);next();}},
  {w:4,fn(next){const held=ITEMS.filter(i=>S.inv[i.id]>1);if(!held.length)return next();const it=pick(held);const lost=Math.ceil(S.inv[it.id]*.4);S.inv[it.id]-=lost;

/* ---------- rollback: restored from a two-day-old backup ---------- */
function snapshot(){
  S.hist=(S.hist||[]).filter(h=>h.day>=S.day-3);
  S.hist.push({day:S.day,loc:S.loc,cash:S.cash,inv:{...S.inv},gate:S.gate,cap:S.cap,raci:S.raci,repaid:S.repaid||0});
}
function rollbackTarget(){
  const h=(S.hist||[]).filter(x=>x.day<=S.day-2).pop();
  if(!h) return null;
  const changed=h.gate!==S.gate||h.cash!==S.cash||ITEMS.some(i=>h.inv[i.id]!==S.inv[i.id]);
  return changed?h:null;
}
function rollbackEvent(next){
  const h=rollbackTarget(); if(!h) return next();
  const refund=(S.repaid||0)-h.repaid;
  const before={gate:S.gate,cash:S.cash,items:used(),loc:S.loc};
  const after={gate:h.gate,cash:Math.max(0,h.cash-refund),items:ITEMS.reduce((n,i)=>n+h.inv[i.id],0),loc:h.loc};
  const lostGates=GATES.slice(h.gate,S.gate).map(g=>g.code);
  const row=(k,a,b)=>`<tr><td>${k}</td><td>${a}</td><td>${b}</td></tr>`;
  showModal({title:'RESTORED FROM BACKUP',alert:1,
    body:`<p>Someone ran the disaster-recovery drill against production. Ops "successfully" restored everything from the backup taken on Day ${h.day}. Two days of your work are gone.</p>
      <p class="dim">The backup was supposed to be nightly. It was not nightly.</p>
      <div class="help tablewrap"><table><tr><th></th><th>Before</th><th>Restored</th></tr>
      ${row('Gates passed',before.gate+'/6',after.gate+'/6')}
      ${row('Budget',fmt(before.cash),fmt(after.cash))}
      ${row('Items held',before.items,after.items)}
      ${row('Location',esc(LOCS[before.loc].name),esc(LOCS[after.loc].name))}
      </table></div>
      <p>${lostGates.length?`Your ${lostGates.join(' and ')} approval${lostGates.length>1?'s were':' was'} wiped. You'll have to pass ${lostGates.length>1?'them':'it'} again. `:''}The calendar did not roll back. Neither did Brenda's ledger. Sanity -10.</p>`,
    buttons:[{label:'Scream into a lanyard',primary:1,fn(){
      S.rolledBack=true;S.cash=after.cash;S.inv={...h.inv};S.gate=h.gate;S.cap=h.cap;S.raci=h.raci;S.repaid=h.repaid+refund;
      const moved=S.loc!==h.loc;S.loc=h.loc;S.hist=[];
      if(moved) genPrices();
      log(`RESTORED FROM BACKUP. Everything is back to how it was on Day ${h.day}${lostGates.length?`, including your ${lostGates.join('/')} approval${lostGates.length>1?'s':''}`:''}. It's still Day ${S.day}.`,'alert');
      if(moved) log(`Your badge now says you're in ${LOCS[S.loc].name}. You are, apparently.`,'dim');
      closeModal();damage(10);next();}}]});
}

function submitGate(){

  const g=GATES[S.gate],L=LOCS[S.loc];

    else log(`The ${g.name} doesn't happen here. Head to ${LOCS[locIdx(g.loc)].name}.`,'alert');
    return render();
  }

    log(`CAB only convenes on Tuesdays (Days 2, 7, 12, 17, 22, 27). ${nc?`Next session: Day ${nc}.`:"There are no more sessions before the deadline. Oof."}`,'alert');return render();}
  const short=Object.entries(g.need).filter(([k,v])=>S.inv[k]<v);

}

function runBingo(next){
  const LEN=30,card=shuffle(BUZZ).slice(0,9),said=new Set(),marked=new Set();
  let t=0,nextAt=.8,wrong=0,over=false,timer=0;
  const box=$('#mbox');

  function say(){
    const tpl=pick(ALLHANDS),n=new Set(tpl.match(/\{\d\}/g)).size,words=[];
    for(let k=0;k<n;k++){
      const unsaid=card.filter(c=>!said.has(c)&&!words.includes(c));
      words.push(unsaid.length&&Math.random()<.25?pick(unsaid):pick(BUZZ.filter(b=>!words.includes(b))));
    }
    const text=tpl.replace(/\{(\d)\}/g,(_,i)=>words[+i].toLowerCase());
    const low=text.toLowerCase();
    BUZZ.forEach(b=>{if(low.includes(b.toLowerCase()))said.add(b);});
    if(tr.firstElementChild&&tr.firstElementChild.classList.contains('dim')&&tr.children.length===1)tr.innerHTML='';

    d.innerHTML=`<span class="sp">${esc(pick(SPEAKERS))}:</span>${esc(text)}`;

  }
  btns.forEach(b=>b.addEventListener('click',()=>{
    if(over)return;const i=+b.dataset.b,w=card[i];

    }
  }));
  function tick(){
    t+=.1;
    $('#b-time').textContent=`0:${String(Math.max(0,Math.ceil(LEN-t))).padStart(2,'0')}`;
    if(t>=nextAt){say();nextAt+=3.2;}
    if(t>=LEN)finish(false);
  }
  function finish(win){
    if(over)return;over=true;clearInterval(timer);btns.forEach(b=>b.disabled=true);
    setTimeout(()=>bingoResult(win,marked.size,wrong,next),1000);
  }
  timer=setInterval(tick,100);
}
function bingoResult(win,count,wrong,next){
  const slip=wrong*2;
  let title,body,apply;
  if(win){
    title='BINGO!';
    body=`<p>You type <b>BINGO</b> into the 4,000-person chat. Three VPs reply "+1". A director asks what it means. You are a legend in the Slack channel your manager doesn't know about.</p>
      <p>A sympathetic SVP slips you discretionary budget: <b>+$2,000</b>. Sanity +10.${slip?` Your ${wrong} slip${wrong>1?'s':''} cost ${slip} sanity.`:''}</p>`;
    apply=()=>{S.cash+=2000;S.sanity=Math.min(100,S.sanity+10);log(`BINGO at the all-hands. +$2,000 and sanity +10.${slip?` Slips: -${slip} sanity.`:''}`,'win');if(slip)damage(slip);};
  } else {
    title='NO BINGO';
    body=`<p>The CEO says "let's make it a great quarter, team" and drops off mid-sentence. You marked ${count} of 9. The recording will be posted to a SharePoint site nobody can find.</p>
      <p>Sanity -${5+slip}.${slip?` That includes ${slip} for tapping words before anyone said them.`:''}</p>`;
    apply=()=>{log(`Sat through an all-hands with no bingo. Sanity -${5+slip}.`,'alert');damage(5+slip);};
  }
  showModal({title,alert:!win,body,buttons:[{label:'Leave the call',primary:1,fn(){closeModal();apply();next();}}]});
}

/* ---------- minigame: the Requirements Walkthrough (a tribute to Desert Bus) ---------- */
function meetingIntro(){
  const box=$('#mbox');
  box.innerHTML=`<h3>REQUIREMENTS WALKTHROUGH</h3>
    <p>Sign-off isn't enough. The BAs want to read all 412 pages out loud on a call. Camera on. Your focus drifts toward sleep the entire time.</p>
    <p class="dim">Hold <b>Nod along</b> (or ← / Space) to steer left. Let go and you drift right into a nap. Steer too far left and you unmute with a "quick question". Stay on the agenda for 30 seconds. When they ask for objections, tap <b>+1</b>.</p>
    <div class="btnrow"><button type="button" class="primary" id="mg-go">Join the call</button></div>`;
  $('#modal').hidden=false;
  $('#mg-go').onclick=runMeeting;$('#mg-go').focus();
}
function runMeeting(){
  const box=$('#mbox');
  box.innerHTML=`<h3>REQUIREMENTS WALKTHROUGH</h3>
    <canvas class="mg" id="mg-c" aria-label="Your focus, drawn as a bus on a straight road. Keep it between the edges."></canvas>
    <div class="mgctl"><button type="button" class="primary steer" id="mg-steer">◀ Nod along</button><button type="button" id="mg-plus" disabled aria-label="Plus one">+1</button></div>
    <p class="dim" id="mg-msg" aria-live="polite">Connecting to audio…</p>`;
  const cv=$('#mg-c'),ctx=cv.getContext('2d'),steer=$('#mg-steer'),plusBtn=$('#mg-plus'),msgEl=$('#mg-msg');
  const css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();
  const C={amber:col('--amber'),dim:col('--dim'),faint:col('--faint'),alert:col('--alert'),screen:col('--screen'),bg:col('--bg')};
  const LEN=30,stops=[9,18,25];
  let x=0,v=0,t=-3,dist=0,last=null,hold=false,plus=0,prompt=null,res=null,raf=0,crashAt=0;
  const lines=["The BA shares the wrong screen. It's their email.","\"Let's take a step back and look at the why.\"","Someone's dog has joined the call.","\"Can everyone see my screen? No? How about now?\"","\"I'll just read this section verbatim.\"","\"Sorry, I was on mute.\"","Page 14 is a picture of page 13.","\"Let's park that in the parking lot.\""];
  let nextLine=5;
  const msg=s=>{msgEl.textContent=s;};
  const setHold=h=>{hold=h;steer.classList.toggle('on',h);};
  const kd=e=>{if(['ArrowLeft','a','A',' '].includes(e.key)){e.preventDefault();setHold(true);}
    if((e.key==='ArrowUp'||e.key==='+'||e.key==='=')&&!plusBtn.disabled){e.preventDefault();doPlus();}};
  const ku=e=>{if(['ArrowLeft','a','A',' '].includes(e.key)){e.preventDefault();setHold(false);}};
  const pd=e=>{e.preventDefault();setHold(true);try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}};
  const pu=()=>setHold(false);
  [steer,cv].forEach(el=>{el.addEventListener('pointerdown',pd);el.addEventListener('pointerup',pu);el.addEventListener('pointercancel',pu);el.addEventListener('lostpointercapture',pu);el.addEventListener('contextmenu',e=>e.preventDefault());});
  document.addEventListener('keydown',kd);document.addEventListener('keyup',ku);
  function doPlus(){if(!prompt)return;plus++;prompt=null;plusBtn.disabled=true;msg(`"+1 from you, noted." (${plus} so far)`);}
  plusBtn.onclick=doPlus;
  steer.focus();

  function size(){const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
    if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
    ctx.setTransform(dpr,0,0,dpr,0,0);return [w,h];}

  function draw(){
    const [W,H]=size(),cx=W/2,rw=Math.min(W*.27,115),scroll=dist*140;
    ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
    ctx.fillStyle=C.faint;
    for(let gy=-1;gy<H/22+2;gy++){for(let gx=0;gx<W/24+1;gx++){
      const px=gx*24+(gy%2?12:0)+4,py=((gy*22+scroll)%(H+44))-22;
      if(Math.abs(px-cx)<rw+8)continue;ctx.fillRect(px,py,2,2);}}
    ctx.font='22px VT323, "Courier New", monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillStyle=x<-.6?C.alert:C.dim;ctx.fillText('?!',(cx-rw)/2,H*.55);
    ctx.fillStyle=x>.6?C.alert:C.dim;ctx.fillText('Zzz',cx+rw+(W-cx-rw)/2,H*.55);
    ctx.font='12px "IBM Plex Mono", monospace';
    ctx.fillStyle=C.dim;ctx.fillText('UNMUTE',(cx-rw)/2,H*.55+20);ctx.fillText('NAP',cx+rw+(W-cx-rw)/2,H*.55+20);
    ctx.fillStyle=C.screen;ctx.fillRect(cx-rw,0,rw*2,H);
    ctx.lineWidth=2;
    ctx.strokeStyle=x<-.7?C.alert:C.dim;ctx.beginPath();ctx.moveTo(cx-rw,0);ctx.lineTo(cx-rw,H);ctx.stroke();
    ctx.strokeStyle=x>.7?C.alert:C.dim;ctx.beginPath();ctx.moveTo(cx+rw,0);ctx.lineTo(cx+rw,H);ctx.stroke();
    ctx.fillStyle=C.faint;for(let y=(scroll%44)-44;y<H;y+=44)ctx.fillRect(cx-1.5,y,3,22);
    const bx=cx+Math.max(-1.3,Math.min(1.3,x))*rw,by=H*.7;
    ctx.save();ctx.translate(bx,by);ctx.rotate(Math.max(-.35,Math.min(.35,v*.14)));
    ctx.fillStyle=C.screen;ctx.strokeStyle=res&&res!=='win'?C.alert:C.amber;ctx.lineWidth=2;
    ctx.fillRect(-13,-26,26,52);ctx.strokeRect(-13,-26,26,52);
    ctx.fillStyle=res&&res!=='win'?C.alert:C.amber;ctx.fillRect(-9,-21,18,7);
    for(let i=0;i<4;i++){ctx.fillRect(-9,-9+i*8,4,4);ctx.fillRect(5,-9+i*8,4,4);}
    ctx.restore();
    ctx.textAlign='left';ctx.textBaseline='top';ctx.font='20px VT323, "Courier New", monospace';ctx.fillStyle=C.amber;
    ctx.fillText(`SLIDE ${Math.floor(dist*.78)+1} / 412`,10,8);
    ctx.textAlign='right';const left=Math.max(0,Math.ceil(LEN-Math.max(0,t)));
    ctx.fillText(`0:${String(left).padStart(2,'0')}`,W-10,8);
    ctx.textAlign='center';ctx.textBaseline='middle';
    if(t<0){ctx.font='72px VT323, "Courier New", monospace';ctx.fillText(String(Math.ceil(-t)),cx,H*.38);}
    if(prompt){ctx.fillStyle=C.screen;ctx.fillRect(cx-110,H*.22-18,220,36);ctx.strokeStyle=C.alert;ctx.strokeRect(cx-110,H*.22-18,220,36);
      ctx.fillStyle=C.alert;ctx.font='22px VT323, "Courier New", monospace';ctx.fillText('ANY OBJECTIONS? TAP +1',cx,H*.22);}
    if(res){ctx.fillStyle=res==='win'?C.amber:C.alert;ctx.font='40px VT323, "Courier New", monospace';
      ctx.fillText(res==='win'?'MEETING ENDED':res==='sleep'?'ZZZZZZZ…':'"QUICK QUESTION…"',cx,H*.38);}
  }

  function frame(ts){
    if(last==null)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;
    if(!res){
      t+=dt;
      if(t>=0){
        if(msgEl.textContent.startsWith('Connecting'))msg('"Okay, let\'s get started. Page one, Purpose."');
        const p=Math.min(1,t/LEN);
        const drift=.55+.6*p+(Math.sin(t*1.7)+Math.sin(t*.63))*.2;
        v+=(drift-(hold?2.3:0))*dt;v*=Math.exp(-1.1*dt);v=Math.max(-1.6,Math.min(1.6,v));
        x+=v*dt*.9;dist+=dt;
        if(!prompt&&stops.length&&t>=stops[0]){stops.shift();prompt={until:t+2.6};plusBtn.disabled=false;}
        if(prompt&&t>prompt.until){prompt=null;plusBtn.disabled=true;msg('Silence. "Great, silence is consent."');}
        if(t>=nextLine&&!prompt){msg(pick(lines));nextLine+=ri(4,6);}
        if(x>1)finish('sleep');else if(x<-1)finish('eager');else if(t>=LEN)finish('win');
      }
    }
    draw();
    if(!res||ts-crashAt<1200)raf=requestAnimationFrame(frame);
  }
  function finish(kind){
    res=kind;crashAt=last;setHold(false);prompt=null;plusBtn.disabled=true;
    document.removeEventListener('keydown',kd);document.removeEventListener('keyup',ku);
    setTimeout(()=>meetingResult(kind,plus,Math.floor(dist*.78)+1),1200);
  }
  raf=requestAnimationFrame(frame);
}
function meetingResult(kind,plus,slide){
  const bonus=plus*250;
  let title,body,apply;
  if(kind==='win'){
    title='YOU SURVIVED';
    body=`<p>Thirty seconds, ${slide} slides, eyes open. You earn 1 point. Nobody knows what points are for.</p>
      <p>The BA lead nominates you for a Spot Award: <b>+$1,000</b>.${plus?` Your ${plus} enthusiastic +1${plus>1?'s':''} earn${plus>1?'':'s'} another <b>${fmt(bonus)}</b>.`:''} Sanity +10.</p>
      <p class="dim">Only ${412-slide} slides left. They've scheduled part two for Thursday.</p>`;
    apply=()=>{S.cash+=1000+bonus;S.sanity=Math.min(100,S.sanity+10);
      log(`You stayed awake through the requirements walkthrough. Spot Award +$1,000${plus?`, +1 bonus ${fmt(bonus)}`:''}. Sanity +10.`);};
  } else if(kind==='sleep'){
    const fine=Math.min(S.cash,1000);
    title='YOU FELL ASLEEP';
    body=`<p>You nodded off on slide ${slide}. Your mic was open. The whole call heard you snore.</p>
      <p>While you slept you were volunteered for 9 action items. You buy the team coffee to apologize: <b>-${fmt(fine)}</b>.${plus?` Your ${plus} +1${plus>1?'s':''} earlier still count: <b>+${fmt(bonus)}</b>.`:''} Sanity -15.</p>`;
    apply=()=>{S.cash+=bonus-fine;log(`You snored through the requirements walkthrough on an open mic. -${fmt(fine)} in apology coffee, 9 action items, sanity -15.`,'alert');damage(15);};
  } else {
    title='"QUICK QUESTION"';
    body=`<p>You got overcaffeinated and unmuted on slide ${slide}: "Quick question, sorry if this was already covered."</p>
      <p>It was covered. Twice. The meeting is extended by 30 minutes and everyone knows it's your fault.${plus?` Your +1s still earn <b>+${fmt(bonus)}</b>.`:''} Sanity -12.</p>`;
    apply=()=>{S.cash+=bonus;log('You asked a "quick question" in the requirements walkthrough. Meeting extended 30 minutes. Sanity -12.','alert');damage(12);};
  }
  showModal({title,alert:kind!=='win',body,buttons:[{label:'Back to work',primary:1,fn(){closeModal();apply();if(!S.over){render();save();}}}]});
}

function pmo(){
  const draw=(msg)=>{
    const room=Math.max(0,CREDIT-S.debt),nf=nextFri();
    const friTxt=nf?(nf===S.day?'That\'s today, so hurry.':`Next Friday is Day ${nf}.`):'Too bad there are no Fridays left.';
    if(!msg&&S.cioReq) msg=`"Your ${fmt(S.cioReq)} is sitting in the CIO's inbox, hon. He signs on Fridays, up on the Executive Floor. ${friTxt}"`;
    showModal({title:'BRENDA FROM THE PMO',
      body:`<p>Brenda looks up from a Gantt chart the size of a bedsheet. "Need funding, hon? I charge 5%. Per day. Compounding. Like a friend would."</p>
            ${msg?`<p>${esc(msg)}</p>`:''}
            <p class="dim">You owe ${fmt(S.debt)} · Budget ${fmt(S.cash)} · Credit limit ${fmt(CREDIT)} · Left ${fmt(room)}${S.cioReq?` · ${fmt(S.cioReq)} awaiting CIO`:''}</p>`,
      buttons:[
        {label:'Borrow $1k',disabled:room<1000,fn(){S.debt+=1000;S.cash+=1000;log("Borrowed $1,000 from Brenda.");draw("She writes it in a notebook. In pen.");}},
        {label:S.cioReq?'$5k pending CIO':'Borrow $5k',disabled:!!S.cioReq,fn(){
          if(room>=5000){S.debt+=5000;S.cash+=5000;log("Borrowed $5,000 from Brenda.");return draw("\"Big plans, huh?\" She smiles. Her eyes don't.");}
          S.cioReq=5000;
          log(`Brenda sent your $5,000 request up to the CIO. It puts you over the ${fmt(CREDIT)} limit, so he has to sign it. He only signs on Fridays, on the Executive Floor. ${friTxt}`,'alert');
          draw(`"Ooh, that takes you over ${fmt(CREDIT)}. I'll need the CIO's John Hancock on this one." She stamps it PENDING with real joy. "He signs on Fridays, up on the Executive Floor. ${friTxt}"`);}},
        {label:'Repay $1k',disabled:S.debt<=0||S.cash<1,fn(){const a=Math.min(1000,S.debt,S.cash);S.debt-=a;S.cash-=a;S.repaid=(S.repaid||0)+a;log(`Repaid ${fmt(a)} to the PMO.`);draw("She crosses out a line. Barely.");}},
        {label:'Repay all',primary:1,disabled:S.debt<=0||S.cash<1,fn(){const a=Math.min(S.debt,S.cash);S.debt-=a;S.cash-=a;S.repaid=(S.repaid||0)+a;log(`Repaid ${fmt(a)} to the PMO.${S.debt===0?' You are free. For now.':''}`);draw(S.debt===0?"\"Pleasure doing business.\" She updates your status to green.":"Partial payment. She's not mad. She's disappointed.");}},
        {label:'Leave',fn(){closeModal();render();save();}}
      ]});
  };
  draw();
}
function cio(){
  if(!S.cioReq){log("The CIO's assistant checks his inbox. There's nothing from you to sign. Ask Brenda for a $5k loan first.",'alert');return render();}
  if(!isFri(S.day)){const nf=nextFri();
    log(`The CIO's assistant blocks the door. "He only signs on Fridays."${nf?` Next Friday: Day ${nf}.`:' There are no Fridays left before the deadline.'}`,'alert');return render();}
  if(S.cioDay===S.day){log("The CIO already signed one thing for you this week. He's not a vending machine.",'alert');return render();}
  const amt=S.cioReq;S.cioDay=S.day;S.cioReq=0;S.debt+=amt;S.cash+=amt;
  log(`The CIO signs your ${fmt(amt)} funding request without reading it, between a tee time and a Gartner call. Brenda releases the money. You now owe ${fmt(S.debt)}.`,'win');
  render();save();
}
function latte(){
  if(S.cash<150){log("You can't afford the fancy latte. You drink the break-room coffee. It tastes like a budget cut.",'alert');return render();}
  S.cash-=150;S.sanity=Math.min(100,S.sanity+15);
  log("You expense a $150 oat-milk lavender latte as a 'client meeting'. Sanity +15.");render();save();
}
function usb(){
  const price=1800;
  if(S.cap>=CAP_MAX){log("Finance capped your token quota after someone's agent burned $2M summarizing the cafeteria menu.",'alert');return render();}
  if(S.cash<price){log(`A token top-up costs ${fmt(price)}. Procurement says that's a fair price. It is not.`,'alert');return render();}
  S.cash-=price;S.cap=Math.min(CAP_MAX,S.cap+30);
  log(`You buy a token top-up at the GPU cage for ${fmt(price)}. Quota +30k (now ${S.cap}k). The servers sigh audibly.`);render();save();
}

function rank(net){
  if(net>=100000) return 'APPLORD · Distinguished Fellow of Actually Shipping';
  if(net>=50000) return 'SVP of Digital Transformation';
  if(net>=20000) return 'Managing Director, Synergy';
  if(net>=0) return 'Senior Manager (raise deferred due to "headwinds")';
  return 'Shipped it. Finance would like a word.';
}
function endGame(kind){
  if(S.over) return;
  S.over=true;S.result=kind;
  const net=S.cash-S.debt;
  let title,txt;
  if(kind==='win'){title=rank(net);txt=`Your app is LIVE in production on Day ${S.day}. Within an hour, someone files a P1 because the font changed. Congratulations, it's yours forever now.`;}
  else if(kind==='time'){title='Project "Paused Indefinitely"';txt=`Day 30 came and went. You made it through ${S.gate} of 6 gates. You've been realigned to the Metaverse Center of Excellence.`;}
  else {title='Burnout';txt="You walk out mid-standup and start an artisanal hot sauce company in Vermont. Honestly? Good for you.";}
  S.final={title,txt,net};
  log(kind==='win'?'*** DEPLOYED TO PRODUCTION ***':'*** GAME OVER ***',kind==='win'?'win':'alert');
  const scores=fetchStore('applord-scores')||[];
  scores.push({win:kind==='win',net,gate:S.gate,day:S.day,title,date:new Date().toISOString().slice(0,10)});
  scores.sort((a,b)=>(b.win-a.win)||(b.gate-a.gate)||(b.net-a.net));
  store('applord-scores',scores.slice(0,5));
  closeModal();render();save();showEnd();
}

    <p>Production backups are "nightly". If Ops runs a recovery drill, you can lose the last two days of progress, gates included. It only happens once per game.</p>
    <p>Watch out for the surprise all-hands call. There's only one per game, and it's mandatory. Play Bullsh*t Bingo: tap a buzzword on your card only after it shows up in the live transcript.</p>
    <p>Brenda lends freely up to $10,000 of total debt. A $5k loan that would take you over that goes to the CIO for sign-off instead. Take it to the Executive Floor on a Friday (Days 5, 10, 15, 20, 25, 30) and he signs it. He signs one request per week, and you can only have one waiting at a time.</p>
    <p>Cubicle Farm has Brenda (loans) and lattes (sanity). The Data Center sells AI token top-ups. Your AI assistant spends 1k tokens tracking each item you carry, so your token quota caps your stash.</p>
    <p class="dim">Desktop keys: T travel · G submit gate · P PMO · C CIO · Q give up · ? help</p>
    <p class="label">Hall of fame (this device)</p>${scoresHtml()}</div>`,
    buttons:[{label:'Got it',primary:1,fn(){closeModal();}},{label:'Start over',fn(){closeModal();newGame();render();save();}}]});
}

/* ---------- render ---------- */
function render(){
  const L=LOCS[S.loc];
  const bar=Math.round(S.sanity/10);
  $('#status').innerHTML=`
    <div class="stat"><span class="label">Day</span><span class="v ${S.day>=26?'bad':''}">${S.day}/${MAXDAY}</span></div>
    <div class="stat"><span class="label">Budget</span><span class="v">${fmt(S.cash)}</span></div>
    <div class="stat"><span class="label">PMO debt${S.cioReq?' · '+fmt(S.cioReq)+' at CIO':''}</span><span class="v ${S.debt>10000?'bad':''}">${fmt(S.debt)}</span></div>
    <div class="stat"><span class="label">AI tokens</span><span class="v">${used()}k/${S.cap}k</span></div>
    <div class="stat wide"><span class="label">Location</span><span class="v">${esc(L.name)}</span></div>
    <div class="stat"><span class="label">Sanity ${S.sanity}</span><span class="bar" aria-label="Sanity ${S.sanity} of 100">${'█'.repeat(bar)}<span class="off">${'░'.repeat(10-bar)}</span></span></div>
    <div class="stat"><span class="label">RACI</span><span class="v">${S.raci?'ARMED':'NONE'}</span></div>`;

  $('#pipe').innerHTML=GATES.map((g,i)=>`<span class="cell ${i<S.gate?'done':i===S.gate?'now':''}">${g.code}${i===S.gate&&!S.over?'<span class="cursor"></span>':''}</span>`).join('<span class="arrow">▸</span>');

  if(S.gate<GATES.length){
    const g=GATES[S.gate],gl=LOCS[locIdx(g.loc)],here=gl.id===L.id;
    let note=here?'You are here. Submit when your stash is ready.':`Submit at ${gl.name}.`;
    if(g.cabOnly){const nc=nextCab();note+=isCab(S.day)?' CAB is in session today.':nc?` Next CAB: Day ${nc}.`:' No CAB sessions left. Yikes.';}
    $('#gate').innerHTML=`<span class="label">Next gate · ${S.gate+1} of 6${g.reward?' · pays '+fmt(g.reward):''}</span>
      <span class="title">${g.code} · ${esc(g.name)}</span>
      <div class="needs">${Object.entries(g.need).map(([k,v])=>`<span class="need ${S.inv[k]>=v?'ok':'short'}">${esc(item(k).name)} ${Math.min(S.inv[k],v)}/${v}</span>`).join('')}</div>
      <span class="note">${esc(note)}</span>`;
  } else {
    $('#gate').innerHTML=`<span class="label">All gates passed</span><span class="title">Your app is in production. It's your problem forever now.</span>`;
  }

  const logEl=$('#log');
  logEl.innerHTML=S.log.map((l,i)=>`<div class="line ${l.c} ${i>=S.log.length-newLines?'new':''}">${esc(l.t)}</div>`).join('');
  logEl.scrollTop=logEl.scrollHeight;newLines=0;

  $('#mwhere').textContent=L.where;
  const dis=S.over;
  $('#market').innerHTML=`<div class="row hdrrow"><span class="label">Item</span><span class="label" style="text-align:right">Price</span><span class="label" style="text-align:right">Own</span><span class="label">Trade</span></div>`+
    ITEMS.map(it=>{const p=S.prices[it.id],na=p==null,own=S.inv[it.id];
      return `<div class="row ${na?'na':''} ${S.hotItem===it.id?'hot':''}"><span class="name">${esc(it.name)}${it.sketchy?'<span class="tag" title="Sketchy: attracts Internal Audit">!</span>':''}</span>
      <span class="price">${na?'—':fmt(p)}</span><span class="own ${own?'has':''}">${own}</span>
      <span class="btns"><button type="button" class="mini" data-buy="${it.id}" ${na||dis?'disabled':''} aria-label="Buy ${esc(it.name)}">Buy</button><button type="button" class="mini" data-sell="${it.id}" ${na||!own||dis?'disabled':''} aria-label="Sell ${esc(it.name)}">Sell</button></span></div>`;}).join('');
  document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>buyPrompt(b.dataset.buy));
  document.querySelectorAll('[data-sell]').forEach(b=>b.onclick=()=>sellPrompt(b.dataset.sell));

  const acts=[];
  acts.push({k:'T',label:'Travel',fn:travelModal,primary:1});
  if(S.gate<GATES.length) acts.push({k:'G',label:`Submit ${GATES[S.gate].code}`,fn:submitGate});
  if(L.id==='cube'){acts.push({k:'P',label:'Brenda (PMO)',fn:pmo});acts.push({k:'L',label:'Latte $150',fn:latte});}
  if(L.id==='dc') acts.push({k:'U',label:'Tokens +30k $1,800',fn:usb});
  if(L.id==='exec'&&S.cioReq) acts.push({k:'C',label:`CIO sign-off (${fmt(S.cioReq)})`,fn:cio});
  const a=$('#actions');
  a.innerHTML=acts.map((x,i)=>`<button type="button" data-a="${i}" class="${x.primary?'primary':''}" ${dis?'disabled':''}><kbd>${x.k}</kbd>${esc(x.label)}</button>`).join('')+
    (S.over?`<button type="button" class="primary" id="b-new">New career</button>`:'')+
    `<button type="button" id="b-help" aria-label="Help"><kbd>?</kbd>Playbook</button>`+
    (S.over?'':`<button type="button" id="b-restart"><kbd>Q</kbd>Give up</button>`);
  a.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>acts[+b.dataset.a].fn());
  $('#b-help').onclick=helpModal;
  if(!S.over) $('#b-restart').onclick=restartPrompt;
  if(S.over) $('#b-new').onclick=()=>{newGame();render();save();};
  actMap=Object.fromEntries(acts.map(x=>[x.k.toLowerCase(),x.fn]));
  actMap.q=restartPrompt;
}
let actMap={};

function save(){store('applord-save',S);}

document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(!$('#modal').hidden){if(e.key==='Escape'&&!S.over&&!/AUDIT|CONSULTANT|IT HAS|WALKTHROUGH|SURVIVED|ASLEEP|QUESTION|ALL-HANDS|BINGO|BACKUP|TRAINING|CERTIFICATE|CORRECT/.test($('#mbox h3')?.textContent||'')) closeModal();return;}
  if(e.target.tagName==='INPUT') return;
  if(e.key==='?'){helpModal();return;}
  if(S.over) return;
  const f=actMap[e.key.toLowerCase()]; if(f){e.preventDefault();f();}
});

function start(data){
  S=(data&&data.S)||fetchStore('applord-save');
  if(!S||!S.inv||!S.prices) newGame();
  if(S.cioReq==null) S.cioReq=0;
  render();
  if(S.over&&S.final) {/* show board at rest; end modal available via New career */}
}
try{window.claude?.hot?.snapshot?.(()=>({S}));}catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
</body>
</html>
